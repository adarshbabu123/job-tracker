name: Daily DevOps Job Tracker

on:
  schedule:
    # 03:00 UTC = 08:30 IST
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  job-tracker:
    name: Collect and Update Job Listings
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: job-tracker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: job-tracker/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short
        # Fail-fast: do not run the collector if tests fail

      - name: Collect jobs and update Google Sheets
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python main.py

      - name: Upload run log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: job-tracker-failure-log
          path: job-tracker/*.log
          if-no-files-found: ignore
          retention-days: 7
